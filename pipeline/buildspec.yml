version: 0.2

phases:
  install:
    commands:
      - echo "Installing dependencies"
      - python3 --version

  pre_build:
    commands:
      - echo "Running validation"
      - python3 -m py_compile app/app.py

  build:
    commands:
      - echo "Packaging application"
      - mkdir -p output
      - cp -r app output/app
      - cp infrastructure/cloudformation/main.yaml output/main.yaml

artifacts:
  files:
    - '**/*'
  base-directory: output